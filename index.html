<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mallasandra Local</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #6b6258;
    --accent: #c9622a;
    --line: #e8e0d5;
    --sidebar-w: 220px;
    --wa-green: #25D366;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    padding: 32px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  header h1 { margin: 0 0 4px; font-size: 1.9rem; letter-spacing: -0.02em; }
  header p  { margin: 0; color: var(--muted); font-size: 0.92rem; }

  /* ── Search ── */
  .search-wrap {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
  }
  #searchBox {
    width: 100%; max-width: 600px;
    display: block; margin: 0 auto;
    padding: 10px 16px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    outline: none;
  }
  #searchBox:focus { border-color: var(--accent); }

  /* ── Layout: sidebar + content ── */
  .layout {
    display: flex;
    align-items: flex-start;
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    gap: 24px;
  }

  /* ── Sidebar ── */
  aside {
    width: var(--sidebar-w);
    flex-shrink: 0;
    position: sticky;
    top: 16px;
  }
  aside h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .sidebar-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 14px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    font-size: 0.93rem;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .sidebar-btn:hover { background: var(--line); }
  .sidebar-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* ── Listings ── */
  main { flex: 1; min-width: 0; }
  .category { margin-bottom: 28px; }
  .category h2 {
    font-size: 1rem;
    margin: 0 0 10px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }
  .listing {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 9px;
  }
  .listing .biz-name { font-weight: 600; font-size: 1rem; }
  .listing .desc { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  .listing .meta {
    margin-top: 8px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.88rem;
  }
  .listing .landmark { color: var(--muted); }

  /* WhatsApp button */
  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--wa-green);
    color: #fff;
    text-decoration: none;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    transition: opacity 0.15s;
  }
  .wa-btn:hover { opacity: 0.88; }
  .wa-btn svg { width: 16px; height: 16px; fill: #fff; flex-shrink: 0; }

  /* ── Empty / status ── */
  .status, .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 20px;
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--accent); }

  /* ── Mobile: sidebar becomes horizontal chips ── */
  @media (max-width: 600px) {
    .layout { flex-direction: column; padding: 16px 12px 50px; gap: 16px; }
    aside { width: 100%; position: static; }
    aside h3 { margin-bottom: 6px; }
    .sidebar-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .sidebar-btn { width: auto; padding: 6px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Mallasandra Local</h1>
  <p>A community-maintained list of local businesses in Mallasandra</p>
</header>

<div class="search-wrap">
  <input id="searchBox" type="text" placeholder="Search by name, category, or landmark…">
</div>

<div class="layout">
  <aside>
    <h3>Browse by</h3>
    <div class="sidebar-chips" id="sidebar"></div>
  </aside>
  <main id="content">
    <div class="status">Loading listings…</div>
  </main>
</div>

<footer>
  Maintained by residents, for residents. Details may change — please confirm with the business directly.
  <br><br>
  <a href="https://docs.google.com/spreadsheets/d/1Kf9kCjCj7ob2sKfWiG88Ge21Kd10nq63QJtsDxkkn-4/edit" target="_blank">Suggest an addition</a>
</footer>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Kf9kCjCj7ob2sKfWiG88Ge21Kd10nq63QJtsDxkkn-4/gviz/tq?tqx=out:csv&sheet=Sheet1";

  // WhatsApp SVG logo
  const WA_SVG = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 0C7.163 0 0 7.163 0 16c0 2.822.737 5.469 2.027 7.773L0 32l8.437-2.01A15.93 15.93 0 0 0 16 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm8.27 22.516c-.344.966-2.01 1.847-2.76 1.965-.75.117-1.688.167-2.72-.167-.627-.2-1.432-.468-2.46-.916-4.328-1.87-7.153-6.228-7.37-6.517-.215-.287-1.76-2.34-1.76-4.463 0-2.122 1.113-3.166 1.508-3.596.394-.43.86-.537 1.147-.537.287 0 .573.003.824.015.264.013.618-.1.967.738.36.858 1.222 2.98 1.33 3.196.107.215.18.466.035.752-.144.287-.215.465-.43.717-.215.25-.452.559-.645.75-.215.214-.438.447-.188.876.25.43 1.112 1.835 2.387 2.973 1.64 1.463 3.022 1.915 3.452 2.13.43.215.68.18.93-.107.25-.287 1.076-1.255 1.362-1.685.287-.43.573-.358 1.003-.215.43.144 2.73 1.29 3.2 1.52.465.23.774.344.884.537.11.19.11 1.115-.234 2.08z"/></svg>`;

  const contentEl = document.getElementById('content');
  const sidebarEl = document.getElementById('sidebar');
  const searchBox = document.getElementById('searchBox');

  let allRows = [];
  let activeMain = 'All';

  // ── Build sidebar ──────────────────────────────────────────
  function buildSidebar(rows) {
    const mains = ['All', ...new Set(rows.map(r => (r.MainCategory || 'Other').trim()).filter(Boolean))].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));
    sidebarEl.innerHTML = '';
    mains.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-btn' + (m === activeMain ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', () => {
        activeMain = m;
        document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        searchBox.value = '';
        applyFilter();
      });
      sidebarEl.appendChild(btn);
    });
  }

  // ── Render listings ────────────────────────────────────────
  function render(rows) {
    if (!rows.length) {
      contentEl.innerHTML = '<div class="empty">No listings found.</div>';
      return;
    }

    // Group by sub-category (Category column)
    const groups = {};
    rows.forEach(r => {
      const cat = (r.Category || 'Other').trim();
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(r);
    });

    let html = '';
    Object.keys(groups).sort().forEach(cat => {
      html += `<div class="category"><h2>${esc(cat)}</h2>`;
      groups[cat].forEach(r => {
        const name     = esc(r.Name || '');
        const desc     = esc(r.Description || '');
        const whatsapp = (r.WhatsApp || r.Phone || '').trim();
        const landmark = esc(r.Landmark || '');
        html += `<div class="listing">
          <div class="biz-name">${name}</div>
          ${desc ? `<div class="desc">${desc}</div>` : ''}
          <div class="meta">
            ${whatsapp ? `<a class="wa-btn" href="${esc(whatsapp)}" target="_blank" rel="noopener">${WA_SVG} Contact on WhatsApp</a>` : ''}
            ${landmark ? `<span class="landmark">📍 ${landmark}</span>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    contentEl.innerHTML = html;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Filter: sidebar + search ───────────────────────────────
  function applyFilter() {
    const q = searchBox.value.trim().toLowerCase();
    let rows = activeMain === 'All' ? allRows : allRows.filter(r => (r.MainCategory || 'Other').trim() === activeMain);
    if (q) rows = rows.filter(r => Object.values(r).join(' ').toLowerCase().includes(q));
    render(rows);
  }

  searchBox.addEventListener('input', applyFilter);

  // ── Load sheet ─────────────────────────────────────────────
  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allRows = results.data.filter(r => r.Name && r.Name.trim());
      buildSidebar(allRows);
      render(allRows);
    },
    error: function() {
      contentEl.innerHTML = '<div class="empty">Could not load listings. Check the sheet link in index.html.</div>';
    }
  });
</script>

</body>
</html>
